<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-a-Sketch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-area">
        <button id="size-btn">Create canvas</button>
        <div id="grid-container"></div>
        <div class="palettes">
            <div id="basics">
                <button class="color-btn" style="background-color: #800517;"></button>
                <button class="color-btn" style="background-color: #FFBF00;"></button>
                <button class="color-btn" style="background-color: #CC5500;"></button>
                <button class="color-btn" style="background-color: green;"></button>
                <button class="color-btn" style="background-color: #08519C;"></button>
                <button class="color-btn" style="background-color: purple;"></button>
                <button class="color-btn" style="background-color: whitesmoke;"></button>
                <button class="color-btn" style="background-color: black;"></button>
            </div>
            <div id="pastels">
                <button class="color-btn" style="background-color: #FF746C;"></button>
                <button class="color-btn" style="background-color: #FFEE8C;"></button>
                <button class="color-btn" style="background-color: #FFC067;"></button>
                <button class="color-btn" style="background-color: #80EF80;"></button>
                <button class="color-btn" style="background-color: #B3EBF2;"></button>
                <button class="color-btn" style="background-color: #C9A0DC;"></button>
                <button class="color-btn" style="background-color: #FFB5C0;"></button>
                <button class="color-btn" style="background-color: #B3B3B3;"></button>
            </div>
            <div id="neons">
                <button class="color-btn" style="background-color: #FF1900;"></button>
                <button class="color-btn" style="background-color: #FFFA00;"></button>
                <button class="color-btn" style="background-color: #FF8800;"></button>
                <button class="color-btn" style="background-color: #00FF2E;"></button>
                <button class="color-btn" style="background-color: #057DFF;"></button>
                <button class="color-btn" style="background-color: #9800FF;"></button>
                <button class="color-btn" style="background-color: #FF00E4;"></button>
                <button class="color-btn" style="background-color: #00FFEF;"></button>
            </div>
    </div>
    </div>

    
    

    <script src="script.js"></script>
</body>
</html>
